[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-career"
version = "0.1.0"
description = "Local-first, Codex-first job search and career management"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Codex Career contributors"}]
dependencies = [
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "reportlab>=4,<5",
]

[project.scripts]
job-agent = "codex_career.cli:main"
career = "codex_career.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codex_career = ["web/*"]
